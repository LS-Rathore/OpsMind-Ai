name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-check:
    name: Backend Syntax & Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install
      - name: Verify Backend Entry Point
        run: |
          cd backend
          node --check src/index.js

  frontend-build:
    name: Build Frontends (User & Admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build User Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Build Admin Frontend
        run: |
          cd admin-frontend
          npm ci || npm install
          npm run build
