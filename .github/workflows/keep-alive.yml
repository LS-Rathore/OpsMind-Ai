# ──────────────────────────────────────────────────────────────────────────────
# Keep-Alive Workflow — Prevents Render free-tier services from sleeping
# ──────────────────────────────────────────────────────────────────────────────
# Render's free tier spins down services after 15 minutes of inactivity.
# This workflow pings the backend /health endpoint every 14 minutes, which:
#   1. Keeps the Express server process alive on Render
#   2. Triggers the in-app MongoDB heartbeat (db.js pings Mongo every 4 min)
#   3. Confirms both server + database connectivity via the health check
#
# Setup:
#   Add these GitHub repository secrets (Settings → Secrets → Actions):
#     BACKEND_URL  → https://opsmind-ai-backend.onrender.com
#     FRONTEND_URL → https://<your-frontend>.onrender.com       (optional)
#     ADMIN_URL    → https://<your-admin-frontend>.onrender.com  (optional)
# ──────────────────────────────────────────────────────────────────────────────

name: Keep Alive — Render + MongoDB

on:
  schedule:
    # Runs every 14 minutes — just under Render's 15-minute idle timeout
    - cron: '*/14 * * * *'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Services
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      ADMIN_URL: ${{ secrets.ADMIN_URL }}

    steps:
      # ── 1. Ping Backend + MongoDB ──────────────────────────────────────
      - name: 🏥 Ping Backend Health Endpoint
        run: |
          echo "🔔 Pinging backend at $(date -u '+%Y-%m-%d %H:%M:%S UTC')..."
          RESPONSE=$(curl -sf --max-time 30 \
            "${BACKEND_URL}/health" 2>&1) && {
            echo "✅ Backend is alive!"
            echo "$RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$RESPONSE"
          } || {
            echo "⚠️ Backend ping failed (may be cold-starting)."
            echo "Response: $RESPONSE"
            # Don't fail the workflow — Render may just be waking up
          }

      # ── 2. Ping MongoDB via dedicated endpoint ────────────────────────
      - name: 🍃 Ping MongoDB via Backend
        run: |
          echo "🔔 Checking MongoDB connectivity..."
          RESPONSE=$(curl -sf --max-time 30 \
            "${BACKEND_URL}/health/db" 2>&1) && {
            echo "✅ MongoDB is reachable!"
            echo "$RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$RESPONSE"
          } || {
            echo "⚠️ MongoDB health check failed."
            echo "Response: $RESPONSE"
          }

      # ── 3. Ping Frontend (if URL is configured) ───────────────────────
      - name: 🖥️ Ping User Frontend
        if: env.FRONTEND_URL != ''
        run: |
          echo "🔔 Pinging frontend..."
          curl -sf --max-time 30 -o /dev/null \
            "${FRONTEND_URL}" && {
            echo "✅ Frontend is alive!"
          } || {
            echo "⚠️ Frontend ping failed."
          }

      # ── 4. Ping Admin Frontend (if URL is configured) ─────────────────
      - name: 🛡️ Ping Admin Frontend
        if: env.ADMIN_URL != ''
        run: |
          echo "🔔 Pinging admin frontend..."
          curl -sf --max-time 30 -o /dev/null \
            "${ADMIN_URL}" && {
            echo "✅ Admin frontend is alive!"
          } || {
            echo "⚠️ Admin frontend ping failed."
          }

      # ── 5. Summary ────────────────────────────────────────────────────
      - name: 📊 Summary
        run: |
          echo "────────────────────────────────────────"
          echo "  Keep-alive cycle completed at $(date -u '+%H:%M:%S UTC')"
          echo "  Next run in ~14 minutes"
          echo "────────────────────────────────────────"
